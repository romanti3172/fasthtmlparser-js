name: Publish

# Publishes z3l-fasthtmlparser to npm on a version tag (v0.1.1) or by hand.
# No token is stored: npm trusted publishing (package settings on npmjs.com, workflow publish.yml) gives this
# workflow a short-lived token through GitHub's OIDC token, and npm adds a provenance statement to the release.
#
# To release: bump "version" in package.json, commit, then
#   git tag v0.1.1 && git push origin v0.1.1
# A version with a pre-release part (0.2.0-beta.1) goes to the "next" dist-tag, not "latest".

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # no dependency cache in the job that can get the OIDC token: setup-node turns the npm cache
          # on by itself once package.json names npm as its "packageManager"
          package-manager-cache: false

      # trusted publishing needs npm 11.5.1 or later
      - run: npm install -g npm@^11.5.1

      - name: Version
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          echo "VERSION=$v" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the version $v in package.json"
            exit 1
          fi
          if npm view "z3l-fasthtmlparser@$v" version >/dev/null 2>&1; then
            echo "::error::z3l-fasthtmlparser $v is already on npm; bump the version in package.json"
            exit 1
          fi
          case "$v" in *-*) echo "DIST_TAG=next" >> "$GITHUB_ENV" ;; *) echo "DIST_TAG=latest" >> "$GITHUB_ENV" ;; esac

      - run: npm ci

      # prepublishOnly runs the type check, the tests, the build and the test of the built package first
      - name: Publish
        run: npm publish --access public --tag "$DIST_TAG"
